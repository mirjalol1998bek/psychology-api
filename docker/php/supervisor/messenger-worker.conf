;/etc/supervisor/conf.d/messenger-worker.conf
;
; Async navbat + scheduler (HEMIS sinxroni). --time-limit har soatda
; jarayonni qayta ishga tushiradi (xotira to'planib qolmasligi uchun).
[program:messenger-consume]
command=php /var/www/html/bin/console messenger:consume async scheduler_hemis --time-limit=3600 --memory-limit=256M
user=root
numprocs=2
startsecs=0
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/html/var/log/messenger.out.log
stderr_logfile=/var/www/html/var/log/messenger.err.log
