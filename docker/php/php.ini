# cgi.fix_pathinfo=0
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M

; --- Tezlik: OPcache + JIT ---------------------------------------------
; PHP kodini kompilyatsiya qilingan holda keshda saqlaydi — har so'rovda
; qayta parse qilinmaydi. Bu Symfony/API Platform'ni sezilarli tezlashtiradi.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10

; Windows/Docker bind-mount sekin (9p/gRPC-FUSE). validate_timestamps=1
; bo'lsa OPcache har "revalidate_freq" soniyada BARCHA kesh fayllarini
; qayta stat qiladi — bu sekinlikning asosiy sababi. dev'da 60s yetarli
; (PHP faylni tahrir qilsangiz: `docker compose exec php php bin/console
; cache:clear` yoki kutib turing). PROD'da 0 qo'ying + deploy'da opcache
; reset (php-fpm restart yoki `cachetool opcache:reset`).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

opcache.jit = tracing
opcache.jit_buffer_size = 128M

; realpath keshi — Symfony ko'p fayl ochadi, sekin FS'da bu muhim
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- APCu: metadata / doctrine / API Platform kesh ---------------------
apc.enable_cli = 0
apc.shm_size = 64M
