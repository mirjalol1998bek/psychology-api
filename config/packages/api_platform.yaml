api_platform:
    title: 'Project name'
    description: 'Project description'
    version: '0.0.1'

    use_symfony_listeners: true

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # `?itemsPerPage=` — front guruh/talaba ro'yxatlarini fakultet/guruh
        # kesimida bir so'rovda oladi (HEMIS'da bir fakultetda yuzlab guruh).
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 2000

    swagger:
        versions: [3]
        api_keys:
            apiKey:
                name: Authorization
                type: header
