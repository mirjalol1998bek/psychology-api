framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # Worker OOM/crash bo'lsa, xabar 5 daqiqada qayta beriladi (1 soat emas).
                options:
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 4
                    max_delay: 600000
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # HEMIS sinxroni — og'ir, sekin, navbatma-navbat. Web so'rovni bloklamaydi.
            App\Component\Organization\Hemis\Message\SyncGroupStudentsMessage: async
            App\Component\Organization\Hemis\Message\SyncFacultyStudentsMessage: async
            App\Component\Organization\Hemis\Message\NightlyHemisSyncMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
